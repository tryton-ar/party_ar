[build-system]
requires = ['hatchling >= 1', 'hatch-tryton']
build-backend = 'hatchling.build'

[project]
name = 'trytonar_party_ar'
dynamic = ['version', 'dependencies', 'optional-dependencies', 'authors', 'readme']
requires-python = '>=3.10'
maintainers = [
    {name = "tryton-ar", email = "info@tryton.org.ar"},
    ]
description='Tryton module that integrates AFIP (Argentina) with party'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE', 'icons/LICENSE', 'COPYRIGHT']
keywords = ["tryton", "party", "argentina", "afip", "arca"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Framework :: Tryton",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    ]

[project.entry-points.'trytond.modules']
party_ar = 'trytond.modules.party_ar'

[project.urls]
homepage = "https://github.com/tryton-ar/party_ar"
documentation = "https://docs.tryton.org/"
changelog = "https://github.com/tryton-ar/party_ar/blob/master/CHANGELOG"
forum = "https://www.tryton.org/forum"
issues = "https://github.com/tryton-ar/party_ar/issues"
funding = "https://www.tryton.org/donate"

[tool.hatch.build]
include = [
    '**/tryton.cfg',
    '**/*.py',
    '**/*.xml',
    'view/**/*.xml',
    'locale/**/*.po',
    'locale/**/override/*.po',
    '**/*.fodt',
    'icons/**/*.svg',
    'tests/**/*.rst',
    'tests/**/*.json',
    'tests/**/*.csv',
    'tests/**/*.key',
    'tests/**/*.crt',
    'data/**/*.xml',
    ]
exclude = ['doc']

[tool.hatch.build.targets.wheel.sources]
"" = "trytond/modules/party_ar"

[tool.hatch.metadata.hooks.tryton]
dependencies = [
    'python-sql >= 0.4',
    'python-stdnum >= 2.2',
    'pyafipws @ git+https://github.com/tryton-ar/pyafipws.git@main',
    ]
copyright = 'COPYRIGHT'
readme = 'README.rst'

[tool.hatch.metadata.hooks.tryton.optional-dependencies]
VIES = ['python-stdnum[SOAP]']
phonenumbers = ['phonenumbers']
phonenumbers-lite = ['phonenumberslite']
test = ['phonenumberslite']

[tool.hatch.metadata.hooks.tryton.tryton-optional-dependencies]
test = ['proteus']

[tool.hatch.metadata]
allow-direct-references = true
